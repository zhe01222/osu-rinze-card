<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu! Profile Card - 杜野凜世 [宵、其の如く]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Rajdhani:wght@600;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <style>
        :root {
            --rinze-red: #b22d35;
            --rinze-gold: #d4af37;
        }
        /* 禁止捲動並讓背景全黑，讓 16:9 的卡片在中間 */
        body { 
            background: #000; 
            font-family: 'Sawarabi Mincho', serif; 
            margin: 0; 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .username-link {
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 20px var(--rinze-red);
        }
        .username-link:hover {
            text-shadow: 0 0 15px rgba(255,255,255,0.8), 0 0 30px var(--rinze-red);
            color: #fff;
        }

        .mode-btn {
            @apply px-4 py-2 text-[0.8vw] font-bold tracking-widest uppercase transition-all duration-300;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: rgba(212, 175, 55, 0.7);
            background: rgba(0, 0, 0, 0.4);
        }
        .mode-btn:hover {
            border-color: var(--rinze-red);
            color: white;
            box-shadow: 0 0 10px rgba(178, 45, 53, 0.5);
        }
        .mode-btn.active {
            border-color: var(--rinze-red);
            background: var(--rinze-red);
            color: white;
            box-shadow: 0 0 15px rgba(178, 45, 53, 0.6);
        }
    </style>
</head>
<body>

    <!-- 容器：鎖定 16:9 比例，並根據視窗大小自動調整 -->
    <div class="relative w-full max-w-[100vw] aspect-video overflow-hidden bg-[#1a1618] shadow-2xl">
        
        <!-- 背景影片：這下保證跟影片原本的構圖完全一致 -->
        <video class="absolute inset-0 w-full h-full object-contain" autoplay loop muted playsinline>
            <source src="1040120020.mp4" type="video/mp4">
        </video>

        <!-- 漸層遮罩 -->
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-[#0d0d0f]/20 to-[#0d0d0f]/95"></div>

        <!-- 內容區塊：使用 vw 單位讓字體大小隨容器縮放 -->
        <div class="relative h-full flex flex-col justify-center p-[5vw] z-10 w-full md:w-7/12 ml-auto text-right">
            
            <div class="mb-[2vw] flex flex-col items-end">
                <a href="https://shinycolors.idolmaster-official.jp/idol/hokagoclimaxgirls/" 
                   target="_blank" 
                   class="border-r-4 border-[#d4af37] pr-[1vw] py-[0.2vw] text-[#d4af37] text-[0.8vw] font-bold tracking-[0.3em] mb-[1.5vw] bg-black/50 hover:text-white hover:border-white transition-all duration-300 cursor-pointer block w-fit">
                    放課後クライマックスガールズ
                </a>
                
                <div class="flex items-center gap-[1.5vw] mt-[0.5vw]">
                    <a id="profile-link" href="#" target="_blank" class="username-link block">
                        <h1 id="osu-username" class="text-white font-['Noto Serif JP'] text-[5vw] tracking-tighter cursor-pointer">Loading...</h1>
                    </a>
                    <img id="osu-avatar" src="" alt="Avatar" class="w-[5vw] h-[5vw] rounded-full border-2 border-[#d4af37]/60 object-cover hidden shadow-2xl">
                </div>
                
                <p id="osu-rank" class="text-slate-400 font-['Rajdhani'] text-[1.2vw] mt-[1vw] tracking-[0.2em] uppercase font-semibold">Connecting...</p>
            </div>

            <!-- 模式切換 -->
            <div class="flex justify-end gap-[0.5vw] mb-[3vw]">
                <button onclick="changeMode('osu', this)" class="mode-btn active">Standard</button>
                <button onclick="changeMode('taiko', this)" class="mode-btn">Taiko</button>
                <button onclick="changeMode('fruits', this)" class="mode-btn">Catch</button>
                <button onclick="changeMode('mania', this)" class="mode-btn">Mania</button>
            </div>

            <!-- 數據區 -->
            <div class="flex justify-end gap-[4vw]">
                <div>
                    <p class="text-[#b22d35] text-[0.8vw] font-bold tracking-[0.2em] mb-[0.5vw]">成果 (PP)</p>
                    <span id="osu-pp" class="font-['Rajdhani'] text-white text-[4vw] font-bold tracking-tight" style="text-shadow: 0 0 1.5vw rgba(178,45,53,0.5);">---</span>
                </div>

                <div class="w-[1px] h-[4vw] my-auto bg-white/10"></div>

                <div>
                    <p class="text-[#00ffcc] text-[0.8vw] font-bold tracking-[0.2em] mb-[0.5vw]">精確度 (ACC)</p>
                    <div class="flex items-baseline justify-end gap-[0.5vw]">
                        <span id="osu-acc" class="font-['Rajdhani'] text-white text-[4vw] font-bold tracking-tight" style="text-shadow: 0 0 1.5vw rgba(0,255,204,0.4);">---</span>
                        <span class="text-[#00ffcc]/60 text-[1vw]">%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchOsuStats(mode = 'osu') {
            const avatarElement = document.getElementById('osu-avatar');
            const usernameElement = document.getElementById('osu-username');
            const rankElement = document.getElementById('osu-rank');
            const ppElement = document.getElementById('osu-pp');
            const accElement = document.getElementById('osu-acc');
            const profileLink = document.getElementById('profile-link');

            try {
                // 使用 Render 的絕對路徑或相對路徑
                const response = await fetch(`/api/my-osu-data?mode=${mode}`);
                if (!response.ok) throw new Error('Offline');

                const data = await response.json();

                avatarElement.src = data.avatar_url;
                avatarElement.classList.remove('hidden');
                profileLink.href = `https://osu.ppy.sh/users/${data.id}/${mode}`;

                usernameElement.innerText = data.username;
                rankElement.innerText = `RANK: #${data.statistics.global_rank.toLocaleString()} / LVL: ${data.statistics.level.current}`;
                ppElement.innerText = Math.round(data.statistics.pp).toLocaleString();
                accElement.innerText = data.statistics.hit_accuracy.toFixed(2);

            } catch (error) {
                usernameElement.innerText = "Error";
                rankElement.innerText = "Server Error";
            }
        }

        function changeMode(mode, btnElement) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            fetchOsuStats(mode);
        }

        window.onload = () => fetchOsuStats('osu');
    </script>
</body>
</html>
